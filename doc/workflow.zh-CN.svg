<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="570" viewBox="0 0 1360 570" role="img" aria-labelledby="title desc">
<title id="title">VMCore 分析工作流程</title><desc id="desc">从崩溃转储输入到证据验证与诊断报告</desc>
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748B"/></marker>
 <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6366F1"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity=".07"/></filter>
 <style>
 text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0F172A}
 .title{font-size:25px;font-weight:750;letter-spacing:.2px}
 .subtitle{font-size:14px;fill:#64748B}
 .phase{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#94A3B8}
 .card{stroke-width:1.8}
 .num{font-size:11px;font-weight:700;fill:#64748B}
 .label{font-size:18px;font-weight:700}
 .detail{font-size:13px;fill:#475569}
 .edge{fill:none;stroke:#64748B;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
 .loop{fill:none;stroke:#6366F1;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
 .edge-label{font-size:13px;font-weight:600;fill:#475569}
 .loop-label{font-size:13px;font-weight:650;fill:#6366F1}
 </style>
</defs>
<rect width="1360" height="570" fill="#F8FAFC"/>
<rect x="24" y="20" width="1312" height="526" rx="22" fill="#FFFFFF" stroke="#E2E8F0"/>
<text class="title" x="54" y="62" text-anchor="start">VMCore 分析工作流程</text>
<text class="subtitle" x="54" y="87" text-anchor="start">从崩溃转储输入到证据验证与诊断报告</text>
<text class="phase" x="54" y="125" text-anchor="start">请求与诊断执行</text>

<rect class="card" rx="15" x="40" y="145" width="190" height="94" fill="#F1F5F9" stroke="#94A3B8"/>
<circle cx="64" cy="169" r="12" fill="#FFFFFF" opacity=".85"/>
<text class="num" x="64" y="173" text-anchor="middle">01</text>
<text class="label" x="135" y="192" text-anchor="middle">客户端请求</text>
<text class="detail" x="135" y="216" text-anchor="middle">vmcore 与调试文件</text>
<rect class="card" rx="15" x="290" y="145" width="190" height="94" fill="#EEF2FF" stroke="#818CF8"/>
<circle cx="314" cy="169" r="12" fill="#FFFFFF" opacity=".85"/>
<text class="num" x="314" y="173" text-anchor="middle">02</text>
<text class="label" x="385" y="192" text-anchor="middle">校验文件路径</text>
<text class="detail" x="385" y="216" text-anchor="middle">FastAPI 创建初始状态</text>
<rect class="card" rx="15" x="540" y="145" width="190" height="94" fill="#ECFEFF" stroke="#06B6D4"/>
<circle cx="564" cy="169" r="12" fill="#FFFFFF" opacity=".85"/>
<text class="num" x="564" y="173" text-anchor="middle">03</text>
<text class="label" x="635" y="192" text-anchor="middle">收集 crash 基础信息</text>
<text class="detail" x="635" y="216" text-anchor="middle">sys · taint · backtrace</text>
<rect class="card" rx="15" x="790" y="145" width="190" height="94" fill="#F3E8FF" stroke="#A78BFA"/>
<circle cx="814" cy="169" r="12" fill="#FFFFFF" opacity=".85"/>
<text class="num" x="814" y="173" text-anchor="middle">04</text>
<text class="label" x="885" y="192" text-anchor="middle">LLM 分析</text>
<text class="detail" x="885" y="216" text-anchor="middle">选择下一步诊断动作</text>
<rect class="card" rx="15" x="1040" y="145" width="190" height="94" fill="#FFF7ED" stroke="#FB923C"/>
<circle cx="1064" cy="169" r="12" fill="#FFFFFF" opacity=".85"/>
<text class="num" x="1064" y="173" text-anchor="middle">05</text>
<text class="label" x="1135" y="192" text-anchor="middle">执行工具</text>
<text class="detail" x="1135" y="216" text-anchor="middle">MCP / crash</text>
<path class="edge" d="M230 192 H282"/>
<path class="edge" d="M480 192 H532"/>
<path class="edge" d="M730 192 H782"/>
<path class="edge" d="M980 192 H1032"/>
<text class="phase" x="54" y="280" text-anchor="start">证据评估与分析结果</text>
<path class="edge" d="M1135 239 V292"/>
<rect class="card" rx="15" x="1000" y="300" width="230" height="94" fill="#F0FDF4" stroke="#4ADE80"/>
<circle cx="1026" cy="324" r="12" fill="#FFFFFF" opacity=".9"/>
<text class="num" x="1026" y="328" text-anchor="middle">06</text>
<text class="label" x="1115" y="348" text-anchor="middle">提取证据</text>
<text class="detail" x="1115" y="373" text-anchor="middle">评估验证 Gate</text>
<rect class="card" rx="15" x="520" y="300" width="300" height="94" fill="#EFF6FF" stroke="#60A5FA"/>
<circle cx="547" cy="324" r="12" fill="#FFFFFF" opacity=".9"/>
<text class="num" x="547" y="328" text-anchor="middle">✓</text>
<text class="label" x="670" y="348" text-anchor="middle">分析完成</text>
<text class="detail" x="670" y="373" text-anchor="middle">生成 Markdown 报告与审计记录</text>
<path class="edge" d="M1000 347 H830"/>
<text class="edge-label" x="915" y="330" text-anchor="middle">无需继续分析</text>
<path class="loop" d="M1115 394 V466 H885 V249"/>
<text class="loop-label" x="1000" y="455" text-anchor="middle">继续分析</text>
<rect x="840" y="474" width="90" height="25" rx="12.5" fill="#EEF2FF"/>
<text class="num" x="885" y="491" text-anchor="middle">反馈循环</text>
</svg>