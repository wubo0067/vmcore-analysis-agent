<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">VMCore Analysis Agent</title>
  <desc id="description">A streamlined penguin-shaped kernel core inside a hexagonal shell; an orange scan line points at a breach in the shell.</desc>
  <style>
    .wm  { fill: #0F172A; }
    .tag { fill: #475569; }
    @media (prefers-color-scheme: dark) {
      .wm  { fill: #F1F5F9; }
      .tag { fill: #94A3B8; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="20" y1="10" x2="236" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16304F"/>
      <stop offset="1" stop-color="#0A1322"/>
    </linearGradient>
    <linearGradient id="ring" x1="58" y1="48" x2="198" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="coreFill" x1="96" y1="74" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFFAFE"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="penguinBody" x1="98" y1="70" x2="158" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#0A1728"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#22D3EE" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="faultGlow">
      <stop stop-color="#FB923C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mark (drawn in a 256 grid, scaled to 168) -->
  <g transform="translate(16 16) scale(.65625)">
    <rect width="256" height="256" rx="60" fill="url(#bg)"/>
    <rect x="1" y="1" width="254" height="254" rx="59" fill="none" stroke="#38BDF8" stroke-opacity=".28" stroke-width="2"/>

    <circle cx="128" cy="128" r="84" fill="url(#glow)"/>

    <!-- outer shell, open at the breach -->
    <path d="M177.9 76.8 197.3 88V168L128 208 58.7 168V88L128 48 147.4 59.2" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- core: a friendly, original penguin -->
    <g transform="translate(0 -2)">
      <ellipse cx="114" cy="184" rx="12" ry="5.5" fill="#FBBF24"/>
      <ellipse cx="142" cy="184" rx="12" ry="5.5" fill="#FBBF24"/>
      <ellipse cx="93" cy="146" rx="8.5" ry="23" transform="rotate(16 93 146)" fill="url(#penguinBody)"/>
      <ellipse cx="163" cy="146" rx="8.5" ry="23" transform="rotate(-16 163 146)" fill="url(#penguinBody)"/>
      <path d="M128 70C112 70 102 82 102 96c0 8 3 14 6 19-9 7-14 19-14 33 0 20 14 34 34 34s34-14 34-34c0-14-5-26-14-33 3-5 6-11 6-19 0-14-10-26-26-26Z" fill="url(#penguinBody)" stroke="url(#ring)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="128" cy="148" rx="21" ry="27" fill="url(#coreFill)"/>
      <circle cx="119" cy="93" r="5.5" fill="#ECFEFF"/>
      <circle cx="137" cy="93" r="5.5" fill="#ECFEFF"/>
      <circle cx="119.5" cy="94" r="2.6" fill="#0A1728"/>
      <circle cx="137.5" cy="94" r="2.6" fill="#0A1728"/>
      <path d="M121 101q7-3 14 0l-7 9Z" fill="#FBBF24" stroke="#FBBF24" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <!-- scan line to the fault -->
    <path d="M149.5 90.8 162.6 68" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
    <circle cx="162.6" cy="68" r="17" fill="url(#faultGlow)"/>
    <circle cx="162.6" cy="68" r="7.5" fill="#FB923C"/>
  </g>

  <!-- Wordmark -->
  <text class="wm" x="216" y="104" font-family="Inter, 'Segoe UI', 'SF Pro Display', system-ui, -apple-system, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">VMCore</text>
  <text class="tag" x="218" y="138" font-family="Inter, 'Segoe UI', 'SF Pro Display', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing=".4">Linux Kernel Analysis Agent</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
